<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>iPhone Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone-frame" id="phoneFrame">
  <div class="dynamic-island"></div>

  <section class="screen lock-screen active" id="lockScreen">
    <div class="lock-bg"></div>
    <div class="status-bar lock-status-bar"><span id="lockStatusTime">00:00</span><span class="status-icons"><b>▂▅▇</b><b>⌁</b><b>▰</b></span></div>
    <div class="lock-content" id="lockContent">
      <div class="lock-icon">⌁</div>
      <div class="lock-date-top" id="lockDateTop"></div>
      <div class="lock-time" id="lockTime"></div>
      <div class="lock-hint">向上滑动以解锁</div>
    </div>
    <div class="lock-bottom-actions">
      <button id="btnFlashlight" aria-label="手电筒">⌁</button><button id="btnCamera" aria-label="相机">⌷</button>
    </div>
    <div class="passcode-overlay" id="passcodeOverlay">
      <div class="passcode-title">输入密码</div><div class="passcode-dots" id="passcodeDots"><i></i><i></i><i></i><i></i></div><div class="passcode-error" id="passcodeError">密码错误</div>
      <div class="keypad">
        <button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button>
        <span></span><button class="key" data-key="0">0</button><button class="key key-delete" id="keyDelete">⌫</button>
      </div>
    </div>
  </section>

  <section class="screen home-screen" id="homeScreen">
    <div class="home-bg"></div>
    <div class="status-bar"><span id="statusTime">00:00</span><span class="status-icons"><b>▂▅▇</b><b>⌁</b><b>▰</b></span></div>
    <div class="widgets">
      <button class="widget widget-calendar" data-app="calendar"><strong id="widgetCalDay">24</strong><span><b id="widgetCalWeek">星期六</b><small id="widgetCalMonth">10月</small></span></button>
      <div class="widget widget-weather"><span class="weather-icon">☀</span><span><strong>28°</strong><small>韶关</small></span></div>
    </div>
    <div class="pages-container" id="pagesContainer">
      <div class="page"><div class="app-grid">
        <button class="app-item" data-app="messages"><img src="icons/icon_messages.png"><span>信息</span></button>
        <button class="app-item" data-app="mail"><img src="icons/icon_mail.png"><span>邮件</span></button>
        <button class="app-item" data-app="notes"><img src="icons/icon_notes.png"><span>备忘录</span></button>
        <button class="app-item" data-app="camera"><img src="icons/icon_camera.png"><span>相机</span></button>
        <button class="app-item" data-app="instagram"><img src="icons/icon_instagram.png"><span>Instagram</span></button>
        <button class="app-item" data-app="browser"><img src="icons/icon_browser.png"><span>浏览器</span></button>
        <button class="app-item" data-app="settings"><img src="icons/icon_settings.png"><span>设置</span></button>
        <button class="app-item" data-app="phone"><img src="icons/icon_phone.png"><span>电话</span></button>
      </div></div>
      <div class="page"><div class="app-grid">
        <button class="app-item" data-app="x"><img src="icons/icon_x.png"><span>X</span></button>
        <button class="app-item" data-app="kakaotalk"><img src="icons/icon_kakaotalk.png"><span>KakaoTalk</span></button>
        <button class="app-item" data-app="calendar"><span class="generated-icon calendar-icon">31</span><span>日历</span></button>
        <button class="app-item" data-app="contacts"><img src="icons/icon_contacts.png"><span>通讯录</span></button>
        <button class="app-item" data-app="photos"><img src="icons/icon_photos.png"><span>照片</span></button>
        <button class="app-item" data-app="voice"><img src="icons/icon_voice_memo.png"><span>录音</span></button>
        <button class="app-item" data-app="xiaohongshu"><img src="icons/icon_xiaohongshu.png"><span>小红书</span></button>
      </div></div>
    </div>
    <div class="page-indicator"><i class="dot active" data-page="0"></i><i class="dot" data-page="1"></i></div>
    <div class="dock"><button class="app-item" data-app="phone"><img src="icons/icon_phone.png"></button><button class="app-item" data-app="messages"><img src="icons/icon_messages.png"></button><button class="app-item" data-app="browser"><img src="icons/icon_browser.png"></button><button class="app-item" data-app="camera"><img src="icons/icon_camera.png"></button></div>
  </section>

  <section class="app-view" id="appView">
    <div class="app-status"><span id="appTime">00:00</span><span>▂▅▇　⌁　▰</span></div>
    <main id="appContent"></main>
    <div class="home-indicator" id="homeIndicator"></div>
  </section>
</div>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ryryry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <!-- Dynamic Island -->
        <div class="dynamic-island"></div>

        <!-- ===== 锁屏 ===== -->
        <div class="screen lock-screen active" id="lockScreen">
            <div class="lock-bg"></div>
            
            <!-- 顶部状态栏 (锁屏专用) -->
            <div class="status-bar lock-status-bar">
                <span class="status-time" id="lockStatusTime">00:00</span>
                <span class="status-icons">
                    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="#fff"/><rect x="5" y="5" width="3" height="7" rx="0.5" fill="#fff"/><rect x="10" y="2" width="3" height="10" rx="0.5" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="0.5" fill="#fff" opacity="0.3"/></svg>
                    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 3.6C10.2 3.6 12.2 4.4 13.7 5.7L15 4.3C13.1 2.6 10.7 1.6 8 1.6S2.9 2.6 1 4.3L2.3 5.7C3.8 4.4 5.8 3.6 8 3.6ZM8 7.2C9.3 7.2 10.5 7.7 11.4 8.5L12.7 7.1C11.4 5.9 9.8 5.2 8 5.2S4.6 5.9 3.3 7.1L4.6 8.5C5.5 7.7 6.7 7.2 8 7.2ZM8 10.8L9.3 9.4C8.9 9.1 8.5 8.8 8 8.8S7.1 9.1 6.7 9.4L8 10.8Z" fill="#fff"/></svg>
                    <svg width="27" height="12" viewBox="0 0 27 12"><rect x="0" y="1" width="23" height="10" rx="2" stroke="#fff" stroke-width="1" fill="none"/><rect x="24" y="4" width="2" height="4" rx="0.5" fill="#fff"/><rect x="1.5" y="2.5" width="18" height="7" rx="1" fill="#34C759"/></svg>
                </span>
            </div>

            <div class="lock-content">
                <div class="lock-icon-svg">
                    <svg width="24" height="30" viewBox="0 0 24 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C7.58 2 4 5.58 4 10V12H2V28H22V12H20V10C20 5.58 16.42 2 12 2ZM18 12H6V10C6 6.69 8.69 4 12 4C15.31 4 18 6.69 18 10V12ZM12 22C10.9 22 10 21.1 10 20C10 18.9 10.9 18 12 18C13.1 18 14 18.9 14 20C14 21.1 13.1 22 12 22Z" fill="white"/>
                    </svg>
                </div>
                <div class="lock-date-top" id="lockDateTop">10月23日 星期五</div>
                <div class="lock-time" id="lockTime">00:00</div>
                <div class="lock-hint">向上滑动以解锁</div>
            </div>

            <div class="lock-bottom-actions">
                <button class="lock-action-btn" id="btnFlashlight">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"/></svg>
                </button>
                <button class="lock-action-btn" id="btnCamera">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                </button>
            </div>

            <div class="passcode-overlay" id="passcodeOverlay">
                <div class="passcode-box">
                    <div class="passcode-title">输入密码</div>
                    <div class="passcode-dots" id="passcodeDots">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <div class="passcode-error" id="passcodeError">密码错误</div>
                    <div class="keypad">
                        <button class="key" data-key="1">1</button>
                        <button class="key" data-key="2">2</button>
                        <button class="key" data-key="3">3</button>
                        <button class="key" data-key="4">4</button>
                        <button class="key" data-key="5">5</button>
                        <button class="key" data-key="6">6</button>
                        <button class="key" data-key="7">7</button>
                        <button class="key" data-key="8">8</button>
                        <button class="key" data-key="9">9</button>
                        <button class="key key-empty"></button>
                        <button class="key" data-key="0">0</button>
                        <button class="key key-delete" id="keyDelete">⌫</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== 主屏幕 ===== -->
        <div class="screen home-screen" id="homeScreen">
            <div class="home-bg"></div>
            <div class="status-bar">
                <span class="status-time" id="statusTime">00:00</span>
                <span class="status-icons">
                    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="#fff"/><rect x="5" y="5" width="3" height="7" rx="0.5" fill="#fff"/><rect x="10" y="2" width="3" height="10" rx="0.5" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="0.5" fill="#fff" opacity="0.3"/></svg>
                    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 3.6C10.2 3.6 12.2 4.4 13.7 5.7L15 4.3C13.1 2.6 10.7 1.6 8 1.6S2.9 2.6 1 4.3L2.3 5.7C3.8 4.4 5.8 3.6 8 3.6ZM8 7.2C9.3 7.2 10.5 7.7 11.4 8.5L12.7 7.1C11.4 5.9 9.8 5.2 8 5.2S4.6 5.9 3.3 7.1L4.6 8.5C5.5 7.7 6.7 7.2 8 7.2ZM8 10.8L9.3 9.4C8.9 9.1 8.5 8.8 8 8.8S7.1 9.1 6.7 9.4L8 10.8Z" fill="#fff"/></svg>
                    <svg width="27" height="12" viewBox="0 0 27 12"><rect x="0" y="1" width="23" height="10" rx="2" stroke="#fff" stroke-width="1" fill="none"/><rect x="24" y="4" width="2" height="4" rx="0.5" fill="#fff"/><rect x="1.5" y="2.5" width="18" height="7" rx="1" fill="#34C759"/></svg>
                </span>
            </div>
            
            <div class="widgets">
                <!-- 日期组件增加了 data-app="calendar" 以便绑定点击事件 -->
                <div class="widget widget-calendar" data-app="calendar">
                    <div class="widget-cal-day" id="widgetCalDay">23</div>
                    <div class="widget-cal-info">
                        <span id="widgetCalWeek">星期五</span>
                        <span id="widgetCalMonth">10月</span>
                    </div>
                </div>
                <div class="widget widget-weather">
                    <div class="widget-weather-icon">☀️</div>
                    <div class="widget-weather-info">
                        <span class="widget-temp">28°</span>
                        <span class="widget-city">韶关</span>
                    </div>
                </div>
            </div>

            <!-- 主屏幕多页布局 -->
            <div class="pages-container" id="pagesContainer">
                <div class="page page-1 active">
                    <div class="app-grid">
                        <div class="app-item" data-app="phone">
                            <img src="icons/icon_phone.png" alt="电话"><span>电话</span>
                        </div>
                        <div class="app-item" data-app="messages">
                            <img src="icons/icon_messages.png" alt="信息"><span>信息</span>
                        </div>
                        <div class="app-item" data-app="mail">
                            <img src="icons/icon_mail.png" alt="邮件"><span>邮件</span>
                        </div>
                        <div class="app-item" data-app="notes">
                            <img src="icons/icon_notes.png" alt="备忘录"><span>备忘录</span>
                        </div>
                        <div class="app-item" data-app="camera">
                            <img src="icons/icon_camera.png" alt="相机"><span>相机</span>
                        </div>
                        <div class="app-item" data-app="instagram">
                            <img src="icons/icon_instagram.png" alt="Instagram"><span>Instagram</span>
                        </div>
                        <div class="app-item" data-app="browser">
                            <img src="icons/icon_browser.png" alt="浏览器"><span>浏览器</span>
                        </div>
                        <div class="app-item" data-app="settings">
                            <img src="icons/icon_settings.png" alt="设置"><span>设置</span>
                        </div>
                    </div>
                </div>
                <div class="page page-2">
                    <div class="app-grid">
                        <!-- 第二页的两个新图标 -->
                        <div class="app-item" data-app="x">
                            <img src="icons/icon_x.png" alt="X"><span>X</span>
                        </div>
                        <div class="app-item" data-app="kanjianta">
                            <img src="icons/icon_kanjianta.png" alt="看见他来了"><span>看见他来了</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 页面指示器 -->
            <div class="page-indicator">
                <div class="dot active" data-page="0"></div>
                <div class="dot" data-page="1"></div>
            </div>

            <!-- Dock -->
            <div class="dock">
                <div class="app-item dock-phone" data-app="phone">
                    <img src="icons/icon_phone.png" alt="电话">
                </div>
                <div class="app-item dock-messages" data-app="messages">
                    <img src="icons/icon_messages.png" alt="信息">
                </div>
                <div class="app-item dock-browser" data-app="browser">
                    <img src="icons/icon_browser.png" alt="浏览器">
                </div>
                <div class="app-item dock-camera" data-app="camera">
                    <img src="icons/icon_camera.png" alt="相机">
                </div>
            </div>
        </div>

        <!-- ===== App 全屏视图 ===== -->
        <div class="app-view" id="appView">
            <div class="app-header">
                <button class="back-btn" id="backBtn">‹ 返回</button>
                <span class="app-title" id="appTitle">应用</span>
            </div>
            <div class="app-content">
                <p style="text-align:center; color:#999; margin-top:40vh;">这里是应用内容区域</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
